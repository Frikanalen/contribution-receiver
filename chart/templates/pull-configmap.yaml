{{- if .Values.pull.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: mediamtx-pull
  labels:
    app: mediamtx
data:
  pull-source: |
    #!/bin/sh
    # The pull relay. MediaMTX runs it when someone reads contrib/live/<UUID>
    # and nobody publishes there, and stops it (SIGINT to the whole process
    # group) once the last reader has been gone a while.
    #
    #   $1  the source UUID    $2  MediaMTX's RTSP port    $3  the path
    #
    # The pull address is a secret (passphrases, stream keys and tokens ride
    # in it), so it is fetched from Django on each start, never stored here,
    # and scrubbed from FFmpeg's messages before they reach the log.
    set -u
    id="$1"
    say() { echo "pull-source $id: $*" >&2; }

    auth=$(printf '%s' "$FK_PULL_CREDENTIAL" | base64 | tr -d '\n')
    if ! url=$(wget -q -T 5 -O - --header "Authorization: Basic $auth" "$FK_PULL_ADDRESS_URL/$id"); then
      # Django down, or the credential refused: MediaMTX tries again.
      say "cannot get the pull address from Django"
      exit 1
    fi
    if [ -z "$url" ]; then
      # A pushed (or disabled) source: an encoder publishes here, not us.
      # Idle until MediaMTX stops us, rather than restarting every 5 s.
      exec sleep 2147483647
    fi

    # Sound languages to prefer, in order, as the playlist tags them. The
    # chart sets a default; a source can override it by ending its address
    # with #audio=sv,en (the fragment never leaves the relay).
    prefs="{{ .Values.pull.audioLanguages }}"
    case "$url" in
      *'#audio='*) prefs="${url##*#audio=}"; url="${url%%#*}" ;;
    esac

    # What FFmpeg may open for each kind of address. Never file: or plain
    # HTTP, which an HLS playlist could otherwise point at.
    input_options=""
    hls=""
    case "$url" in
      srt://*) allow=srt ;;
      rtmp://* | rtmps://*) allow=rtmp,rtmps,tcp,tls ;;
      rtsp://* | rtsps://*) allow=rtsp,rtsps,rtp,tcp,tls,udp; input_options="-rtsp_transport tcp" ;;
      https://*) allow=https,tls,tcp,crypto,data; hls=1 ;;
      *) say "refusing an address of an unknown kind"; exit 1 ;;
    esac

    out="rtsp://127.0.0.1:$2/$3"
    video="$url"
    audio=""
    base=""
    maps="-map 0:v:0 -map 0:a:0?"
    if [ -n "$hls" ]; then
      # HLS arrives a segment at a time: unpaced, the picture runs for a
      # moment and then stands still until the next segment. -re reads it
      # at the speed it plays.
      input_options="-re"
      # Read the playlist ourselves rather than letting FFmpeg probe it: a
      # master playlist with many sound tracks (EbS has the floor and 29
      # interpretations) makes FFmpeg open every one of them, which takes
      # longer than MediaMTX waits for the pull to start. Instead pick the
      # variant and the sound track here and give FFmpeg just those two.
      if ! playlist=$(wget -q -T 15 -O - "$url" | head -c 1048576 | tr -d '\r'); then
        say "cannot fetch the playlist"
        exit 1
      fi
      case "$playlist" in
        *'#EXT-X-STREAM-INF'*)
          # The variant with the highest BANDWIDTH (lowest first as often as
          # not), and in its AUDIO group the first track whose LANGUAGE is in
          # the preference list, else the group's DEFAULT, else its first.
          choice=$(printf '%s\n' "$playlist" | awk -v prefs="$prefs" '
            function attr(line, name,   s) {
              if (match(line, "[:,]" name "=\"[^\"]*\"")) {
                s = substr(line, RSTART, RLENGTH); sub(/^[:,][^=]*="/, "", s); sub(/"$/, "", s); return s
              }
              if (match(line, "[:,]" name "=[^,]*")) {
                s = substr(line, RSTART, RLENGTH); sub(/^[:,][^=]*=/, "", s); return s
              }
              return ""
            }
            /^#EXT-X-MEDIA:/ && attr($0, "TYPE") == "AUDIO" {
              n++; grp[n] = attr($0, "GROUP-ID"); lang[n] = tolower(attr($0, "LANGUAGE"))
              uri[n] = attr($0, "URI"); def[n] = attr($0, "DEFAULT") == "YES"
            }
            /^#EXT-X-STREAM-INF:/ { pending = 1; bw = attr($0, "BANDWIDTH") + 0; ag = attr($0, "AUDIO"); next }
            pending && /^[^#]/ {
              if (vuri == "" || bw > best) { best = bw; vuri = $0; group = ag }
              pending = 0
            }
            END {
              if (vuri == "") exit
              a = 0
              np = split(tolower(prefs), want, ",")
              for (w = 1; w <= np && !a; w++)
                for (i = 1; i <= n; i++)
                  if (grp[i] == group && group != "" && want[w] != "" && lang[i] == want[w]) { a = i; break }
              for (i = 1; i <= n && !a; i++) if (grp[i] == group && group != "" && def[i]) a = i
              for (i = 1; i <= n && !a; i++) if (grp[i] == group && group != "") a = i
              print best
              print vuri
              print (a ? uri[a] : "")
              print (a ? (lang[a] == "" ? "untagged" : lang[a]) : "")
            }')
          bandwidth=$(printf '%s\n' "$choice" | sed -n 1p)
          video_uri=$(printf '%s\n' "$choice" | sed -n 2p)
          audio_uri=$(printf '%s\n' "$choice" | sed -n 3p)
          audio_lang=$(printf '%s\n' "$choice" | sed -n 4p)
          if [ -z "$video_uri" ]; then
            say "the master playlist lists no variant"
            exit 1
          fi
          # Relative addresses are relative to the master playlist, not
          # counting its query.
          base="${url%%\?*}"
          base="${base%/*}/"
          # An absolute address is taken as written; FFmpeg's protocol
          # whitelist still refuses anything but HTTPS.
          resolve() {
            case "$1" in
              *://*) printf '%s' "$1" ;;
              /*) printf '%s%s' "$(printf '%s' "$url" | sed -E 's#^([a-z]+://[^/]+).*#\1#')" "$1" ;;
              *) printf '%s%s' "$base" "$1" ;;
            esac
          }
          video=$(resolve "$video_uri")
          if [ -n "$audio_uri" ]; then
            audio=$(resolve "$audio_uri")
            say "taking the $bandwidth b/s variant, sound in $audio_lang from its own playlist"
          else
            # The sound is in the variant itself (or there is none).
            say "taking the $bandwidth b/s variant${audio_lang:+, sound in $audio_lang muxed with the picture}"
          fi
          ;;
      esac
    fi

    say "pulling from $(echo "$url" | sed -E 's#^([a-z]+://)([^@/]*@)?([^/?]*).*#\1\3#')"
    # The inputs: the address (or the chosen variant), and for a separate
    # sound playlist a second input. The two HLS playlists keep their own
    # timestamps (-copyts), which share the packager's timeline, so picture
    # and sound stay in step however far apart their live edges begin. No
    # -start_at_zero: it shifts EACH input by its own first timestamp, which
    # puts the sound a whole segment (or more) off the picture. The kept
    # timestamps are epoch-sized, though, and RTSP readers then misplace the
    # sound by a few hundred ms, so -avoid_negative_ts make_zero moves every
    # track back by ONE shared offset to start near zero.
    # shellcheck disable=SC2086
    if [ -n "$audio" ]; then
      set -- -copyts \
        $input_options -i "$video" $input_options -i "$audio" -map 0:v:0 -map 1:a:0
    else
      set -- $input_options -i "$video" $maps
    fi
    # -muxdelay 0 and -flush_packets 1: without them the RTP muxer holds
    # packets back by its default delay, and the copied picture and the
    # re-encoded sound leave at different times. MediaMTX timestamps what it
    # receives, so readers got the sound ~0.3 s behind the picture.
    ffmpeg -nostdin -hide_banner -loglevel warning \
      -protocol_whitelist "$allow" -rw_timeout 15000000 \
      "$@" \
      -c:v copy \
      -af aresample=async=1 \
      -c:a aac -b:a {{ .Values.pull.audioBitrate }} -ar 48000 -ac 2 \
      -avoid_negative_ts make_zero \
      -flush_packets 1 -muxdelay 0 \
      -f rtsp -rtsp_transport tcp "$out" 2>&1 |
      awk -v u1="$video" -v u2="$audio" -v u3="$url" -v u4="$base" -v id="$id" '{
        # Every address that came from the pull address is as secret as it.
        split(u1 "\n" u2 "\n" u3 "\n" u4, us, "\n")
        for (k = 1; k <= 4; k++) {
          u = us[k]
          while (u != "" && (i = index($0, u)) > 0)
            $0 = substr($0, 1, i - 1) "<pull address>" substr($0, i + length(u))
        }
        print "pull-source " id ": " $0
        fflush()
      }' >&2
    say "FFmpeg ended"
    exit 1
{{- end }}
