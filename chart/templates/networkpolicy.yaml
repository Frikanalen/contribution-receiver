{{- if .Values.networkPolicy.enabled }}
# MediaMTX may open connections to the internet, to Django (the auth
# callback and the pull relay's address lookup) and to DNS, but not to
# anything else in the cluster or on the LAN: the pull relay fetches
# addresses members type in. Connections made to MediaMTX, and their
# replies, are not affected.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mediamtx-egress
  labels:
    app: mediamtx
spec:
  podSelector:
    matchLabels:
      app: mediamtx
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
{{ toYaml .Values.networkPolicy.deniedCIDRs | indent 14 }}
    - to:
        - podSelector:
            matchLabels:
{{ toYaml .Values.networkPolicy.djangoPodLabels | indent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.djangoPort }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
